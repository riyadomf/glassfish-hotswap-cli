name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          ignore_paths: .github docs
          severity: warning

  compile-java:
    name: Compile HotSwap.java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile with -Xlint:all
        run: |
          # JDI lives in jdk.jdi; include it on the module path explicitly.
          javac -Xlint:all --add-modules jdk.jdi tools/HotSwap.java
